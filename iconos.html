<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Íconos de la app · Qualisig</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#F3F5FA;--ink:#0E1A33;--mut:#68758E;--line:#E4E9F2;--brand:#1F47B8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}
.card{width:min(720px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 1px 2px rgba(14,26,51,.04),0 24px 60px -30px rgba(14,26,51,.3)}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}p{color:var(--mut);margin:0 0 18px;line-height:1.55;font-size:14.5px}
label{font-size:12.5px;font-weight:700;color:var(--mut)}input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:500 14px inherit;margin:6px 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap}button{height:46px;padding:0 22px;border-radius:99px;border:0;background:var(--brand);color:#fff;font:700 14.5px inherit;cursor:pointer}
button.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 4px}
.it{text-align:center;font-size:12px;color:var(--mut)}.it canvas{width:100%;aspect-ratio:1;border-radius:18px;background:repeating-conic-gradient(#eef1f6 0 25%,#fff 0 50%) 0 0/16px 16px;border:1px solid var(--line);display:block;margin-bottom:6px}
.it a{color:var(--brand);font-weight:700;text-decoration:none}.msg{margin-top:14px;font-size:13.5px;font-weight:600}.ok{color:#0C7346}.err{color:#B42318}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="card">
  <h1>Íconos de la aplicación</h1>
  <p>Genera los íconos de Qualisig a partir de tu logo, para instalar la app en celulares y computadores. Descarga el ZIP y sube su carpeta <b>icons</b> a la raíz del repositorio.</p>
  <label for="src">Imagen del ícono (cuadrado, sin texto)</label>
  <input id="src" value="https://i.imgur.com/ht6IpCi.png">
  <div class="row"><button id="go">Generar íconos</button><button class="sec" id="zip" disabled>Descargar icons.zip</button></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
</div>
<script>
const SIZES = [
  { name: 'icon-192.png', size: 192, fill: .78, round: 0 },
  { name: 'icon-512.png', size: 512, fill: .78, round: 0 },
  { name: 'icon-maskable-512.png', size: 512, fill: .58, round: 0 },
  { name: 'apple-touch-icon.png', size: 180, fill: .74, round: 0 },
  { name: 'favicon-32.png', size: 32, fill: .92, round: 0 }
];
const $ = s => document.querySelector(s); let OUT = [];
function load(src) {
  return new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => rej(new Error('No se pudo cargar la imagen (revise el enlace).')); i.src = src + (src.includes('?') ? '&' : '?') + 'v=' + Date.now(); });
}
function clean(img) {
  const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, w, h), q = d.data; let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let i = 0, p = 0; i < q.length; i += 4, p++) {
    const mn = Math.min(q[i], q[i + 1], q[i + 2]), mx = Math.max(q[i], q[i + 1], q[i + 2]);
    if (mx - mn < 26 && mn > 228) q[i + 3] = Math.round(q[i + 3] * Math.max(0, (255 - mn) / 27));
    if (q[i + 3] > 18) { const px = p % w, py = (p / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  }
  x.putImageData(d, 0, 0); if (x1 < 0) throw new Error('La imagen está vacía.');
  const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height); return o;
}
function render(mark, s) {
  const c = document.createElement('canvas'); c.width = c.height = s.size; const x = c.getContext('2d');
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, s.size, s.size);
  const k = Math.min(s.size * s.fill / mark.width, s.size * s.fill / mark.height), w = mark.width * k, h = mark.height * k;
  x.imageSmoothingQuality = 'high'; x.drawImage(mark, (s.size - w) / 2, (s.size - h) / 2, w, h); return c;
}
$('#go').onclick = async () => {
  $('#msg').textContent = 'Generando…'; $('#msg').className = 'msg'; $('#grid').innerHTML = ''; OUT = []; $('#zip').disabled = true;
  try {
    const mark = clean(await load($('#src').value.trim()));
    for (const s of SIZES) {
      const c = render(mark, s), url = c.toDataURL('image/png'); OUT.push({ name: s.name, url });
      const d = document.createElement('div'); d.className = 'it'; d.appendChild(c); d.insertAdjacentHTML('beforeend', `<a download="${s.name}" href="${url}">${s.name}</a>`); $('#grid').appendChild(d);
    }
    $('#zip').disabled = false; $('#msg').textContent = 'Listo. Descarga el ZIP o cada ícono por separado.'; $('#msg').className = 'msg ok';
  } catch (e) { $('#msg').textContent = e.message; $('#msg').className = 'msg err'; }
};
$('#zip').onclick = async () => {
  const z = new JSZip(), f = z.folder('icons'); OUT.forEach(o => f.file(o.name, o.url.split(',')[1], { base64: true }));
  const b = await z.generateAsync({ type: 'blob' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'icons.zip'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$('#go').click();
</script>
</body>
</html>
